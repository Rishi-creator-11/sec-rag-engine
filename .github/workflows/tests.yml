name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # No external services are called: OpenAI/Cohere/Pinecone are
        # patched at the api.rag seam (see tests/test_api.py's module
        # docstring). No secrets are required for this job.
        run: python -m pytest -q
